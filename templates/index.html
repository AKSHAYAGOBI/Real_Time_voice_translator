<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Translator</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #4A90E2;
        }
        .container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 400px;
        }
        button {
            background-color: #4A90E2;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #357ABD;
        }
        p {
            font-size: 1.1em;
            margin: 10px 0;
        }
        select {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ddd;
            width: 100%;
            margin: 10px 0;
            font-size: 1em;
        }
        #result, #translation {
            margin-top: 20px;
            padding: 10px;
            background-color: #e7f3ff;
            border-left: 6px solid #4A90E2;
            border-radius: 5px;
            display: inline-block;
            width: 100%;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Voice Translator</h1>
        <button onclick="startRecognition()">Start Recording</button>
        <div id="result"></div>
        <label for="source_language">Select Source Language:</label>
        <select id="source_language">
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="zh-cn">Chinese</option>
            <option value="hi">Hindi</option>
            <option value="ja">Japanese</option>
            <option value="ru">Russian</option>
            <!-- Add more languages as needed -->
        </select>
        <label for="language">Select Target Language:</label>
        <select id="language">
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="zh-cn">Chinese</option>
            <option value="hi">Hindi</option>
            <option value="ja">Japanese</option>
            <option value="ru">Russian</option>
            <!-- Add more languages as needed -->
        </select>
        <label><input type="checkbox" id="auto_translate" checked> Auto Translate & Speak</label>
        <button onclick="translateText()">Translate</button>
        <div id="translation"></div>
    </div>

    <script>
        let recognizedText = "";

        function startRecognition() {
            const sourceLang = document.getElementById('source_language').value;
            fetch('/recognize', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ source_lang: sourceLang })
            })
            .then(response => response.json())
            .then(data => {
                if (data.text) {
                    recognizedText = data.text;
                    document.getElementById('result').innerText = 'Recognized: ' + recognizedText;
                } else {
                    document.getElementById('result').innerText = 'Error: ' + (data.error || 'Recognition failed');
                }
            })
            .catch(error => {
                document.getElementById('result').innerText = 'Error: ' + error;
            });
        }

        function translateText() {
            const sourceLang = document.getElementById('source_language').value;
            const targetLanguage = document.getElementById('language').value;
            if (!recognizedText) {
                document.getElementById('translation').innerText = 'Error: No recognized text. Please record first.';
                return;
            }
            fetch('/translate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ text: recognizedText, source_lang: sourceLang, language: targetLanguage })
            })
            .then(response => response.json())
            .then(data => {
                if (data.translated_text) {
                    document.getElementById('translation').innerText = 'Translated: ' + data.translated_text;
                    speak(data.translated_text, targetLanguage);
                } else {
                    document.getElementById('translation').innerText = 'Translation error';
                }
            })
            .catch(error => {
                document.getElementById('translation').innerText = 'Error: ' + error;
            });
        }

        function speak(text, language) {
            console.log('Speaking:', text, 'in', language);
            // Try browser TTS first (immediate playback)
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = language;
                utterance.rate = 0.9;
                speechSynthesis.speak(utterance);
                console.log('Browser TTS started:', text);
            } else {
                // Fallback to server TTS
                console.log('Using server TTS fallback');
                fetch('/speak', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text, language: language })
                })
                .then(response => response.json())
                .then(data => console.log('Server TTS:', data));
            }
        }

        function translateText() {
            const sourceLang = document.getElementById('source_language').value;
            const targetLanguage = document.getElementById('language').value;
            const autoTranslate = document.getElementById('auto_translate').checked;
            console.log('Translate:', recognizedText, 'auto:', autoTranslate);

            if (!recognizedText) {
                document.getElementById('translation').innerText = 'Error: No recognized text. Please record first.';
                return;
            }
            document.getElementById('translation').innerText = 'Translating...';
            fetch('/translate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: recognizedText, source_lang: sourceLang, language: targetLanguage })
            })
            .then(response => response.json())
            .then(data => {
                if (data.translated_text) {
                    document.getElementById('translation').innerText = 'Translated: ' + data.translated_text;
                    if (autoTranslate) {
                        speak(data.translated_text, targetLanguage);
                    }
                } else {
                    document.getElementById('translation').innerText = 'Translation error';
                }
            })
            .catch(error => {
                document.getElementById('translation').innerText = 'Error: ' + error;
                console.error('Translate error:', error);
            });
        }
    </script>
</body>
</html>
